name: Deploy

# Publishes the site on every push to main (and on demand). The nginx host behind
# https://powerdns-authadmin.org only accepts SSH from known networks, so nothing here
# pushes to it. Instead this job builds and checks the site, commits dist/ to the `site`
# branch, and the host pulls that branch every minute (deploy/pull-site.sh + the systemd
# timer next to it). build.txt carries the source commit, so the job can wait until the
# live site serves this build, then smoke-test every URL and ping IndexNow.
#
# The job builds and checks the site itself rather than waiting for ci.yml, so a deploy
# never depends on another run's artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        env:
          SITE_URL: https://powerdns-authadmin.org
        run: node scripts/build.mjs

      - name: SEO, links, structured data, CSP, privacy, search
        run: node scripts/check.mjs

      - name: Validate HTML
        run: npx --yes html-validate@9 "dist/**/*.html"

      - name: Publish dist/ to the site branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_SHA" > dist/build.txt
          git -C dist init -q -b site
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add -A
          git -C dist commit -q -m "site: build of ${GITHUB_SHA} (${GITHUB_RUN_ID})"
          git -C dist push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/site
          echo "Published $(git -C dist rev-parse --short HEAD) to the site branch."

      - name: Wait for the host to pull this build
        run: |
          url="$(sed -n 's|^Sitemap: \(.*\)/sitemap\.xml$|\1|p' dist/robots.txt | head -n 1)"
          echo "Waiting for ${url}/build.txt to read ${GITHUB_SHA}"
          for i in $(seq 1 40); do
            live="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "${url}/build.txt" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live after about $((i * 15)) seconds."
              exit 0
            fi
            sleep 15
          done
          echo "::error::The live site still serves build '${live:-?}' after 10 minutes. Check pull-site.timer on the host (journalctl -t pull-site)."
          exit 1

      - name: Smoke test every URL
        run: sh scripts/smoke-test.sh

      - name: IndexNow
        run: node scripts/indexnow.mjs
