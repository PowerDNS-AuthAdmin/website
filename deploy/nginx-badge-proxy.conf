# /etc/nginx/snippets/pda-badge-proxy.conf - shared by every footer-badge location in
# pda-badges.conf (generated from src/badges.mjs). Each location sets $badge_upstream to
# one fixed URL; nothing from the request picks the upstream, so this is not an open proxy.

# A variable proxy_pass resolves the host per request. IPv4 only: the host has no IPv6
# route, and badge CDNs (shields.io) publish AAAA records nginx would otherwise try.
resolver                      1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout              5s;
proxy_pass                    $badge_upstream;
proxy_ssl_server_name         on;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_http_version            1.1;
proxy_connect_timeout         5s;
proxy_read_timeout            10s;
# GitHub's badge responses carry very large headers (its own CSP), beyond the 4k default.
proxy_buffer_size             32k;
proxy_buffers                 8 32k;

# Nothing of the visitor's (cookies, IP headers, referrer, user agent) goes upstream.
proxy_pass_request_headers    off;
proxy_pass_request_body       off;
proxy_method                  GET;
proxy_set_header              Host $proxy_host;
proxy_set_header              User-Agent "powerdns-authadmin.org badge proxy";
proxy_set_header              Accept "image/svg+xml";
proxy_set_header              Accept-Encoding "";

# One copy for everyone, refreshed hourly; a failing upstream keeps the last good badge.
proxy_hide_header             Set-Cookie;
proxy_hide_header             Content-Security-Policy;
proxy_ignore_headers          Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
proxy_cache                   pda_badges;
proxy_cache_key               $badge_upstream;
proxy_cache_valid             200 1h;
proxy_cache_valid             any 1m;
proxy_cache_use_stale         error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock              on;

limit_except GET HEAD { deny all; }

# add_header here replaces the server block's, so the security headers are repeated.
# The SVG gets a CSP of its own: no scripts, no fetches, sandboxed if opened directly.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Content-Security-Policy   "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cache-Control             "public, max-age=3600" always;
add_header X-Badge-Cache             $upstream_cache_status always;
